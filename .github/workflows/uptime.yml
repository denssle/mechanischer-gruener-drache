name: Bot erreichbar

# Der Check im Deploy prüft nur beim Deploy. Dieser hier merkt auch einen Ausfall um drei Uhr nachts:
# Schlägt der Lauf fehl, schickt GitHub eine Mail. Mehrere Versuche, weil ein Deploy kurz neu startet.
# Gefragt wird der Gesundheits-Endpunkt (seit 2026-11-22, src/server/gesundheit.router.ts):
# 200 = gesund, 503 = Bot läuft, aber etwas fehlt (Redis weg, Datenbank leer, Persistenz aus,
# Discord getrennt; der Befund steht im Antworttext), 502 = nginx, der Bot läuft gar nicht.
# Anlass: am 2026-11-22 war nach einem Host-Neustart die Datenbank leer, der alte Check auf
# /twitch/eventsub blieb grün, weil der Prozess ja lief.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check bot health
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          for versuch in 1 2 3 4; do
            antwort=$(curl -s -w '\n%{http_code}' --max-time 10 https://enzlor.uber.space/config/gesundheit || true)
            status=$(printf '%s' "$antwort" | tail -n 1)
            befund=$(printf '%s' "$antwort" | sed '$d' | head -c 500)
            if [ "$status" = "200" ]; then
              echo "Bot gesund."
              exit 0
            fi
            echo "Versuch $versuch: HTTP $status"
            [ "$status" = "503" ] && echo "$befund"
            sleep 30
          done
          echo "Bot nicht gesund. Logs: ~/logs/supervisord.log, Details: /diagnose"
          exit 1
